<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#4DD0B1" stroke="#333" stroke-width="2"/>
  
  <!-- Clothing hanger icon -->
  <g transform="translate(100, 60)">
    <!-- Hanger hook -->
    <path d="M -8 -15 Q -8 -25 0 -25 Q 8 -25 8 -15" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Hanger bar -->
    <line x1="-25" y1="-10" x2="25" y2="-10" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Shirt/clothing -->
    <path d="M -25 -10 L -20 5 L -15 20 L 15 20 L 20 5 L 25 -10" stroke="#333" stroke-width="2" fill="none" stroke-linejoin="round"/>
    
    <!-- Neckline -->
    <path d="M -8 -5 Q 0 0 8 -5" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">ClothZia</text>
</svg>
